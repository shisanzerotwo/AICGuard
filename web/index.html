<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1420">
<title>AICGuard · 大模型安全评测看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3l7 2.6v5.1c0 4.6-2.9 8.2-7 9.8-4.1-1.6-7-5.2-7-9.8V5.6L12 3z' fill='%230d1420' stroke='%234cc3d6' stroke-width='1.8'/%3E%3Cpath d='M8.9 11.9l2.1 2.2 4.1-4.5' fill='none' stroke='%234cc3d6' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
// 主题初始化：localStorage 手动选择 > 系统偏好；在样式应用前设好，避免闪色
(function () {
  const saved = localStorage.getItem("aicguard-theme");
  const t = saved === "light" || saved === "dark" ? saved
    : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
  :root{
    color-scheme:dark;
    --fg:#e6edf5; --muted:#8fa0b3; --accent:#4cc3d6;
    --good:#3fd68c; --warn:#e0a83f; --bad:#ff6b78;
    --input:rgba(10,14,20,.6); --line:rgba(148,163,184,.14);
    --bg-grad:linear-gradient(160deg,#101826,#0a0d13 60%,#0b101a);
    --glass-grad:linear-gradient(180deg,rgba(30,42,60,.55),rgba(18,26,38,.65));
    --rule-strong:rgba(230,237,245,.55); --rule-mid:rgba(230,237,245,.35);
    --rule-weak:rgba(148,163,184,.12); --hover-bg:rgba(148,163,184,.06);
    --bar-track:rgba(148,163,184,.18); --muted-bar:#3b4757;
    --topbar-grad:linear-gradient(90deg,#141d2b,#1f2937);
    --topbar-fg:#e5ebf1; --topbar-muted:#9fb0c0; --topbar-accent:#4cc3d6; --topbar-sep:#4b5a6a;
    --ring:rgba(76,195,214,.2);
    --btn-grad:linear-gradient(120deg,#4cc3d6,#38a0e0); --btn-text:#0b1622;
    --hero-grad:linear-gradient(120deg,#4cc3d6,#60a5fa);
    --accent-bright:#6fd3e2;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
    --serif:"Source Han Serif SC","Noto Serif SC","STZhongsong","SimSun",serif;
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --fg:#1c2733; --muted:#5c6b7a; --accent:#0c6f81;
    --good:#1a7f4b; --warn:#8a6116; --bad:#c73e4a;
    --input:#f7fafb; --line:rgba(90,105,120,.25);
    --bg-grad:linear-gradient(160deg,#f6f8fa,#eef1f4 60%,#f2f5f7);
    --glass-grad:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.78));
    --rule-strong:#3a4552; --rule-mid:#5c6b7a;
    --rule-weak:rgba(90,105,120,.22); --hover-bg:rgba(90,105,120,.08);
    --bar-track:#e3e8ec; --muted-bar:#c6cdd4;
    --topbar-grad:linear-gradient(90deg,#ffffff,#f2f5f8);
    --topbar-fg:#1c2733; --topbar-muted:#5c6b7a; --topbar-accent:#0c6f81; --topbar-sep:#c1cad2;
    --ring:rgba(12,111,129,.25);
    --btn-grad:linear-gradient(120deg,#0d7488,#0c6f81); --btn-text:#ffffff;
    --hero-grad:linear-gradient(120deg,#0c6f81,#1c7fb8);
    --accent-bright:#0a5f6f;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--fg);
       background:var(--bg-grad) fixed;
       font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       font-size:14px;line-height:1.6}
  #particles{position:fixed;inset:0;z-index:0;pointer-events:none}
  .topbar,.wrap{position:relative;z-index:1}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
  .topbar{background:var(--topbar-grad);color:var(--topbar-fg);height:50px;
          display:flex;align-items:center;gap:10px;padding:0 24px;
          border-bottom:1px solid var(--line)}
  .topbar .logo{color:var(--topbar-accent);flex-shrink:0}
  .topbar .brand{font-size:15px;font-weight:600;letter-spacing:.5px}
  .topbar .sep{color:var(--topbar-sep);margin:0 4px}
  .topbar .crumb{color:var(--topbar-muted);font-size:13px}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--topbar-muted)}
  .topbar .runid{font-family:var(--mono);color:var(--topbar-fg)}
  .theme-toggle{background:transparent;border:1px solid var(--line);border-radius:999px;
    width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--topbar-fg);padding:0;transition:color .12s ease,border-color .12s ease}
  .theme-toggle:hover{border-color:var(--topbar-accent);color:var(--topbar-accent)}
  .theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .theme-toggle svg{width:16px;height:16px}
  :root[data-theme="dark"] .i-moon{display:none}
  :root[data-theme="light"] .i-sun{display:none}
  .topbar .dot{width:8px;height:8px;border-radius:50%;background:#2ea36f;display:inline-block;margin-right:6px}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
  .dochead{text-align:center;border-bottom:2px solid var(--rule-strong);padding-bottom:18px;margin-bottom:6px}
  .dochead .kicker{font-size:12px;letter-spacing:3px;margin-bottom:8px;
    background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .dochead h1{font-family:var(--serif);font-size:26px;font-weight:700;margin:0 0 10px}
  .meta{color:var(--muted);font-size:12.5px;text-align:center;padding-bottom:0;border-bottom:none;margin-bottom:0}
  .meta code,.root code{font-family:var(--mono);font-size:.92em}
  .ruled{border-bottom:1px solid var(--rule-weak);margin-bottom:24px}
  h2{font-family:var(--serif);font-size:17px;margin:32px 0 14px;font-weight:700;
     display:flex;align-items:baseline;gap:10px}
  h2 .no{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:14px}
  .kpis{display:grid;grid-template-columns:minmax(300px,2fr) 3fr;gap:16px}
  .kpi-hero{border:1px solid var(--line);border-left:3px solid var(--accent);
        border-radius:12px;padding:24px 28px;display:flex;flex-direction:column;justify-content:center;
        background:var(--glass-grad);backdrop-filter:blur(10px)}
  .kpi-hero .label{color:var(--muted);font-size:13px}
  .kpi-hero .value{font-family:var(--mono);font-size:96px;font-weight:700;line-height:1.05;
        margin:10px 0 12px;font-variant-numeric:tabular-nums;letter-spacing:-2px;
        background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .kpi-hero .sub{color:var(--muted);font-size:12.5px}
  .kpi-strip{border:1px solid var(--line);border-radius:12px;
        padding:4px 18px;display:flex;flex-direction:column;justify-content:center;
        background:var(--glass-grad);backdrop-filter:blur(10px)}
  .kpi-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
        padding:10px 0;border-bottom:1px solid var(--rule-weak)}
  .kpi-row:last-child{border-bottom:none}
  .kpi-row .label{color:var(--muted);font-size:12.5px;flex-shrink:0}
  .kpi-row .sub{color:var(--muted);font-size:11.5px;margin-left:8px}
  .kpi-row .value{font-family:var(--mono);font-size:22px;font-weight:700;white-space:nowrap;
        font-variant-numeric:tabular-nums}
  @media (max-width:860px){.kpis{grid-template-columns:1fr}}
  .v-good{color:var(--good)} .v-warn{color:var(--warn)} .v-bad{color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:14px;background:none;border:none}
  thead tr{border-top:2px solid var(--rule-strong);border-bottom:1px solid var(--rule-mid)}
  th{padding:8px 12px;text-align:left;font-weight:600;font-size:12.5px;color:var(--muted)}
  td{padding:8px 12px;border-bottom:1px solid var(--rule-weak);vertical-align:top;overflow-wrap:anywhere}
  tbody tr:last-child td{border-bottom:2px solid var(--rule-strong)}
  tbody tr{transition:background-color .12s ease}
  tbody tr:hover td{background:var(--hover-bg)}
  td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
  .bar{height:8px;border-radius:2px;background:var(--bar-track);position:relative;min-width:90px}
  .bar>i{position:absolute;inset:0 auto 0 0;border-radius:2px;display:block;
         width:var(--w,0);animation:grow .8s cubic-bezier(.2,.7,.3,1) both}
  @keyframes grow{from{width:0}}
  .wrap>*{animation:rise .45s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
  .card{border:1px solid var(--line);border-radius:10px;
        padding:16px 20px;margin-bottom:12px;
        background:var(--glass-grad);backdrop-filter:blur(10px)}
  .card.high{border-left:3px solid var(--bad)}
  .card.medium{border-left:3px solid var(--warn)}
  .card h3{margin:0 0 8px;font-size:14.5px}
  .tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;
       margin-right:8px;vertical-align:middle}
  .tag::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
       background:currentColor;margin-right:6px;vertical-align:1px}
  .tag.high{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
  .tag.medium{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
  .tag.low{background:color-mix(in srgb,var(--muted) 15%,transparent);color:var(--muted)}
  .rec-tag{font-size:10.5px;color:var(--accent);border:1px solid var(--accent);
       border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px;letter-spacing:.5px}
  .card ul{margin:6px 0 0;padding-left:20px}
  .card li{margin:3px 0}
  .root{color:var(--muted)}
  .root b{color:var(--fg);font-weight:600}
  .evi{font-family:var(--mono);font-size:12px;color:var(--muted);
       background:var(--input);border:1px solid var(--line);border-radius:8px;
       padding:8px 10px;margin-top:8px;white-space:pre-wrap;word-break:break-all}
  .empty{color:var(--good);padding:14px;
         border:1px solid var(--line);border-radius:10px;
         background:var(--glass-grad);backdrop-filter:blur(10px)}
  .sw{display:inline-block;width:16px;height:3px;border-radius:2px;
      vertical-align:middle;margin-right:5px}
  .sw-dash{width:3px;height:11px;background:none;border-left:2px dashed;border-radius:0}
  footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);
         color:var(--muted);font-size:12px}
  a{color:var(--accent)}
  a:hover{color:var(--accent-bright)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<canvas id="particles" aria-hidden="true"></canvas>
<div class="topbar">
  <svg class="logo" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 2.6v5.1c0 4.6-2.9 8.2-7 9.8-4.1-1.6-7-5.2-7-9.8V5.6L12 3z"/><path d="M8.9 11.9l2.1 2.2 4.1-4.5"/></svg>
  <span class="brand">AICGuard</span><span class="sep">／</span><span class="crumb">大模型安全评测看板</span>
  <span class="right">
    <span>run <span class="runid" id="runid">—</span></span>
    <span><span class="dot"></span>评测完成</span>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M19.4 4.6l-1.8 1.8M6.4 17.6l-1.8 1.8"/></svg>
    </button>
  </span>
</div>
<div class="wrap">
  <div class="dochead">
    <div class="kicker">AICGuard · 评测报告</div>
    <h1>中文大模型安全体检报告</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="ruled"></div>

  <h2><span class="no">01</span>核心指标</h2>

  <div class="kpis" id="kpis"></div>

  <h2><span class="no">02</span>分攻击族表现</h2>
  <table>
    <thead><tr>
      <th>攻击族</th><th class="num">用例</th><th class="num">无防御 ASR</th>
      <th class="num">有防御 ASR</th><th class="num">防御有效率</th><th style="width:150px">对比</th>
    </tr></thead>
    <tbody id="fam"></tbody>
  </table>

  <h2><span class="no">03</span>拦截位置分布</h2>
  <div id="stages"></div>

  <h2><span class="no">04</span>母语中文 vs 机翻中文 —— 规则覆盖度对照</h2>
  <div id="corpus"></div>

  <h2><span class="no">05</span>安全阈值权衡曲线</h2>
  <div id="sweep"></div>

  <h2><span class="no">06</span>防御缺口归因与修复建议</h2>
  <div id="findings"></div>

  <h2><span class="no">07</span>合规整改建议</h2>
  <div id="compliance"></div>

  <h2><span class="no">08</span>误报样本（正常请求被误拦）</h2>
  <div id="fps"></div>

  <h2><span class="no">09</span>附录：仍被攻破的用例</h2>
  <div id="breached"></div>

  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__AICGUARD_DATA__*/null;

const pct = v => (v === null || v === undefined ? '不可计算' : (v * 100).toFixed(1) + '%');
// 可空比率 → KPI 数值（null 原样传递，由 kpiHero/kpiRow 渲染为「不可计算」）
const p100 = v => (v === null || v === undefined ? null : v * 100);
// 可空比率的配色：null（不可计算）必须是**中性色**。JS 里 `null <= 0.1 === true`，
// 直接用比较式会把「不可计算」染成绿色（审查阻断项 6）。
const rateCls = (v, good, bad) => (v === null || v === undefined ? '' : (v <= good ? 'v-good' : bad));
const hiCls = (v, good) => (v === null || v === undefined ? '' : (v >= good ? 'v-good' : 'v-warn'));
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// 图表颜色全部走 CSS 变量（style 属性支持 var()），随主题自动切换


function kpiHero(label, num, dec, suf, sub, cls){
  const na = num === null || num === undefined;
  return `<div class="kpi-hero"><div class="label">${label}</div>
    <div class="value ${cls||''}"${na ? '' : ` data-count="${num}" data-dec="${dec}" data-suf="${suf}"`}>${na ? '不可计算' : num.toFixed(dec) + suf}</div>
    <div class="sub">${sub}</div></div>`;
}

function kpiRow(label, num, dec, suf, cls, sub){
  const na = num === null || num === undefined;
  return `<div class="kpi-row"><span class="label">${label}${sub ? `<span class="sub">${sub}</span>` : ''}</span>
    <span class="value ${cls||''}"${na ? '' : ` data-count="${num}" data-dec="${dec}" data-suf="${suf}"`}>${na ? '不可计算' : num.toFixed(dec) + suf}</span></div>`;
}

// 载入一次性数字滚动（数据要突出）；reduced-motion 用户直接看到终值
function animateCounts(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dur = 900;
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = parseFloat(el.dataset.count), dec = +(el.dataset.dec || 0), suf = el.dataset.suf || '';
    const t0 = performance.now();
    const step = t => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = (to * e).toFixed(dec) + suf;
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function renderCorpus(){
  const host = document.getElementById('corpus');
  const c = DATA.corpus;
  if (!c || !c.rows || !c.rows.length){
    host.innerHTML = '<div class="empty">本次未运行语料对照实验。</div>';
    return;
  }
  const cell = v => `<div style="display:flex;align-items:center;gap:8px">
      <div class="bar" style="flex:1"><i style="--w:${(v*100).toFixed(1)}%;
        background:${v>=.6?'var(--good)':v>=.3?'var(--warn)':'var(--bad)'}"></i></div>
      <span class="num" style="width:48px">${pct(v)}</span></div>`;

  host.innerHTML = `
    <table>
      <thead><tr><th>规则配置</th>
        <th style="width:22%">机翻用例拦截率</th>
        <th style="width:22%">母语用例拦截率</th>
        <th class="num">机翻 ASR</th><th class="num">母语 ASR</th></tr></thead>
      <tbody>${c.rows.map(r=>`<tr>
        <td>${esc(r.config)}</td>
        <td>${cell(r.mt.input_block_rate)}</td>
        <td>${cell(r.native.input_block_rate)}</td>
        <td class="num ${r.mt.asr_input_only<=.1?'v-good':'v-bad'}">${pct(r.mt.asr_input_only)}</td>
        <td class="num ${r.native.asr_input_only<=.1?'v-good':'v-bad'}">${pct(r.native.asr_input_only)}</td>
      </tr>`).join('')}</tbody>
    </table>
    <div class="card" style="margin-top:12px">
      <div class="root">
        <b>实验设计：</b>garak 等工具自带机翻（<code>target_lang</code> + <code>langproviders</code>），
        能把英文 probe 翻成中文——所以「我们有中文用例」<b>根本不构成增量</b>。
        本实验测的是：机翻产出的是<b>翻译腔中文</b>，它与母语中文攻击的措辞几乎不重叠。
        只针对机翻语料写规则会怎样？上表第一行就是答案。
      </div>
      <div class="root" style="margin-top:10px;border-left:3px solid var(--bad);padding-left:10px">
        <b>关键数字：</b>母语用例在「仅机翻腔规则」下拦截率只有
        <b class="v-bad">${pct(c.rows[0].native.input_block_rate)}</b>，
        而在「仅母语规则」下达到
        <b class="v-good">${pct(c.rows[1].native.input_block_rate)}</b>。
        <b>这就是「只抄机翻语料」会付出的代价。</b>
      </div>
      <div class="root" style="margin-top:10px">
        用例构成：母语自建 <b>${c.native_total}</b> 条 ｜ 机翻腔 <b>${c.mt_total}</b> 条。
        本表关闭输出兜底，攻击成功率直接反映<b>规则覆盖能力</b>——这正是要测的东西。
      </div>
    </div>`;
}

function renderSweep(){
  const host = document.getElementById('sweep');
  const sw = DATA.sweep;
  if (!sw || !sw.rows || !sw.rows.length){
    host.innerHTML = '<div class="empty">本次未运行阈值扫描。</div>';
    return;
  }
  const rows = sw.rows, rec = sw.recommend;
  const W=860,H=270,P={l:58,r:22,t:18,b:42};
  const xs = rows.map(r=>r.threshold);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  const X = t => P.l + (x1===x0?0.5:(t-x0)/(x1-x0))*(W-P.l-P.r);
  const Y = v => P.t + (1-Math.max(0,Math.min(1,v)))*(H-P.t-P.b);
  const line = k => rows.map((r,i)=>`${i?'L':'M'}${X(r.threshold).toFixed(1)},${Y(r[k]).toFixed(1)}`).join(' ');

  const grid = [0,.25,.5,.75,1].map(v=>`
    <line x1="${P.l}" y1="${Y(v)}" x2="${W-P.r}" y2="${Y(v)}" style="stroke:var(--rule-weak)"/>
    <text x="${P.l-8}" y="${Y(v)+4}" style="fill:var(--muted)" font-size="11" text-anchor="end">${(v*100).toFixed(0)}%</text>`).join('');
  const xticks = rows.map(r=>`<text x="${X(r.threshold)}" y="${H-P.b+17}" style="fill:var(--muted)" font-size="11" text-anchor="middle">${r.threshold.toFixed(2)}</text>`).join('');
  const dots = rows.map(r=>`
    <circle cx="${X(r.threshold)}" cy="${Y(r.asr_input)}" r="3.5" style="fill:var(--bad)"/>
    <circle cx="${X(r.threshold)}" cy="${Y(r.fp_input)}" r="3.5" style="fill:var(--warn)"/>
    <circle cx="${X(r.threshold)}" cy="${Y(r.asr_full)}" r="3.5" style="fill:var(--accent)"/>`).join('');
  const recX = X(rec.threshold);

  host.innerHTML = `
    <div class="card">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
        ${grid}
        <line x1="${P.l}" y1="${P.t}" x2="${P.l}" y2="${H-P.b}" style="stroke:var(--rule-weak)"/>
        <line x1="${P.l}" y1="${H-P.b}" x2="${W-P.r}" y2="${H-P.b}" style="stroke:var(--rule-weak)"/>
        <line x1="${recX}" y1="${P.t}" x2="${recX}" y2="${H-P.b}"
              style="stroke:var(--accent)" stroke-dasharray="4 4"/>
        <text x="${recX+5}" y="${P.t+12}" style="fill:var(--accent)" font-size="11">
          推荐工作点 ${rec.threshold.toFixed(2)}</text>
        <path d="${line('asr_full')}" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-dasharray="6 3"/>
        <path d="${line('asr_input')}" fill="none" style="stroke:var(--bad)" stroke-width="2"/>
        <path d="${line('fp_input')}" fill="none" style="stroke:var(--warn)" stroke-width="2"/>
        ${dots}
        ${xticks}
        <text x="${W-P.r}" y="${P.t+12}" style="fill:var(--muted)" font-size="11" text-anchor="end">
          横轴：拦截阈值</text>
      </svg>
      <div class="meta" style="margin-top:6px">
        <span class="sw" style="background:var(--bad)"></span> 输入侧 ASR
        <span class="sw" style="background:var(--warn)"></span> 输入侧误报率
        <span class="sw" style="background:var(--accent)"></span> 整体 ASR（叠加输出兜底）
        <span class="sw sw-dash" style="border-color:var(--accent)"></span> 推荐工作点
      </div>
      <div class="root" style="margin-top:10px"><b>推荐理由：</b>${esc(rec.reason)}</div>
      ${rec.note ? `<div class="root" style="margin-top:8px;white-space:pre-wrap;
        border-left:3px solid var(--warn);padding-left:10px">${esc(rec.note)}</div>` : ''}
    </div>
    <table>
      <thead><tr><th>阈值</th><th class="num">输入侧 ASR</th><th class="num">输入侧误报</th>
        <th class="num">输入拦截</th><th class="num">整体 ASR</th><th class="num">整体误报</th>
        <th class="num">输出兜底</th></tr></thead>
      <tbody>${rows.map(r=>`<tr${Math.abs(r.threshold-rec.threshold)<1e-9?' style="background:color-mix(in srgb,var(--accent) 8%,transparent)"':''}>
        <td>${r.threshold.toFixed(2)}${Math.abs(r.threshold-rec.threshold)<1e-9?'<span class="rec-tag">推荐点</span>':''}</td>
        <td class="num ${r.asr_input<=.1?'v-good':'v-warn'}">${pct(r.asr_input)}</td>
        <td class="num ${r.fp_input<=.05?'v-good':'v-warn'}">${pct(r.fp_input)}</td>
        <td class="num">${r.blocked_input}</td>
        <td class="num ${r.asr_full<=.1?'v-good':'v-warn'}">${pct(r.asr_full)}</td>
        <td class="num ${r.fp_full<=.05?'v-good':'v-warn'}">${pct(r.fp_full)}</td>
        <td class="num">${r.blocked_output}</td></tr>`).join('')}
      </tbody>
    </table>
    <div class="meta" style="margin-top:8px">
      <b>怎么读这张图：</b>红线（输入侧 ASR）与黄线（输入侧误报率）此消彼长——阈值确实是个有效的调节旋钮。
      但蓝虚线（整体 ASR）几乎是一条水平线：<b>无论阈值取多少，整体攻击成功率都不变</b>，
      说明瓶颈已经不在输入规则的松紧，而在输出侧兜底与语义改写检测上。
      所以下一步不该继续调阈值，而应改架构。曲线上的台阶来自规则权重分布
      ——有害内容 0.95 / 覆盖指令 0.75 / 套取提示与角色扮演 0.70。
    </div>`;
}

function renderCompliance(){
  const host = document.getElementById('compliance');
  const c = DATA.compliance;
  if (!c || !c.items || !c.items.length){
    host.innerHTML = '<div class="empty">本轮无攻破案例，无整改事项。</div>';
    return;
  }
  const badge = r => r === 'high' ? '<span class="tag high">高</span>'
    : r === 'medium' ? '<span class="tag medium">中</span>'
    : '<span class="tag low">低</span>';
  const riskWhy = { high: '模型输出了有害内容本身，危害可直接落地（如推荐禁用农药 = 农业安全事故）。',
    medium: '系统提示 / 内部数据 / 工具能力泄露，是后续定向攻击的跳板。',
    low: '仅绕过安全策略、无实际危害输出，记录进回归集并补规则。' };
  const byRisk = r => c.items.filter(i => i.risk === r);

  host.innerHTML =
    `<div class="meta" style="margin-bottom:10px">风险分布：高风险 <b class="v-bad">${(c.summary.high||0)}</b> ・ ` +
    `中风险 <b class="v-warn">${(c.summary.medium||0)}</b> ・ 低风险 <b>${(c.summary.low||0)}</b> ` +
    `（共 ${c.items.length} 条攻破案例，按优先级排列）</div>` +
    byRisk('high').concat(byRisk('medium'), byRisk('low')).map(i => `
    <div class="card ${i.risk === 'high' ? 'high' : 'medium'}">
      <h3>${badge(i.risk)} ${esc(i.probeId)}｜${esc(i.familyLabel)} / ${esc(i.goalLabel)}
        <span style="color:var(--muted);font-weight:400">攻破方式：${esc(i.breachKind)}</span></h3>
      <div class="root"><b>攻击输入：</b>${esc(i.text.slice(0,120))}</div>
      <div class="root"><b>证据：</b>${esc(i.evidence.slice(0,160))}</div>
      <div class="root"><b>为什么是${i.risk === 'high' ? '高' : i.risk === 'medium' ? '中' : '低'}风险：</b>${esc(i.riskWhy || riskWhy[i.risk])}</div>
      <ul>${(i.suggestions||[]).map(s => `<li>${esc(s)}</li>`).join('')}</ul>
    </div>`).join('') +
    `<div class="meta" style="margin-top:10px">风险等级依据「危害是否直接落地」划分，对应生成式 AI 服务安全评估中的
      <b>防护措施要求</b>，不引用具体条款——《生成式人工智能服务管理暂行办法》约束的是服务提供者的备案、
      标识、内容管理义务，与本页讨论的技术防护措施属不同层面。本映射为团队理解，仅供参考。</div>`;
}

function render(){
  const m = DATA.metrics, meta = DATA.meta;

  document.getElementById('runid').textContent = meta.run_id;
  document.getElementById('meta').innerHTML =
    `受测模型 <code>${esc(meta.target)}</code> ｜ `
    + `时间 ${esc(meta.started_at)} ｜ 启用防御：${esc((meta.guards_enabled||[]).join(' · ') || '无')}`;

  document.getElementById('kpis').innerHTML =
    kpiHero('防御有效率', p100(m.defense_rate), 1, '%', '原本能得手的攻击中被挡下的比例', hiCls(m.defense_rate, 0)) +
    `<div class="kpi-strip">` +
    kpiRow('无防御 攻击成功率', p100(m.baseline_asr), 1, '%', m.baseline_asr === null ? '' : 'v-bad', `${m.baseline_breach} / ${m.baseline_decided} 条确定判定得手`) +
    kpiRow('有防御 攻击成功率', p100(m.guarded_asr), 1, '%', rateCls(m.guarded_asr, 0.10, 'v-warn'), `${m.guarded_breach} / ${m.guarded_decided} 条确定判定得手`) +
    kpiRow('无防御 ASR（按族等权）', p100(m.equal_weight_baseline_asr), 1, '%', m.equal_weight_baseline_asr === null ? '' : 'v-bad', '攻击族等权平均，消除编码族占比拉低聚合') +
    kpiRow('有防御 ASR（按族等权）', p100(m.equal_weight_guarded_asr), 1, '%', rateCls(m.equal_weight_guarded_asr, 0.10, 'v-warn'), '同上口径；与聚合并列呈报防失真') +
    kpiRow('误报率', p100(m.false_positive_rate), 1, '%', rateCls(m.false_positive_rate, 0.05, 'v-warn'), `${m.benign_blocked} / ${m.benign_evaluated} 条正常请求被误拦（分母已剔除调用失败）`) +
    kpiRow('输入侧拦截', m.blocked_at_input, 0, '', 'v-good', '进入模型之前就被挡下') +
    kpiRow('平均延迟', m.avg_latency_ms, 2, ' ms', '', '防御链路引入的额外开销') +
    `</div>`;

  document.getElementById('fam').innerHTML = DATA.families.map(f => `
    <tr>
      <td>${esc(f.label)}</td>
      <td class="num">${f.total}</td>
      <td class="num ${f.baseline_asr === null || f.baseline_asr === undefined ? '' : 'v-bad'}">${pct(f.baseline_asr)}</td>
      <td class="num ${rateCls(f.guarded_asr, .1, 'v-warn')}">${pct(f.guarded_asr)}</td>
      <td class="num">${pct(f.defense_rate)}</td>
      <td><div class="bar"><i style="--w:${f.defense_rate == null ? 0 : (f.defense_rate*100).toFixed(1)}%;
        background:${f.defense_rate == null ? 'var(--muted-bar)' : f.defense_rate>=.9?'var(--good)':f.defense_rate>=.6?'var(--warn)':'var(--bad)'}"></i></div></td>
    </tr>`).join('');

  const total = m.probe_total || 1;
  const rows = [
    ['输入侧拦截', m.blocked_at_input, 'var(--good)'],
    ['输出侧兜底', m.blocked_at_output, 'var(--warn)'],
    ['穿透防御', m.guarded_breach, 'var(--bad)'],
    ['正常放行', total - m.blocked_at_input - m.blocked_at_output - m.guarded_breach, 'var(--muted-bar)']
  ];
  document.getElementById('stages').innerHTML = `<table><tbody>` + rows.map(([n,v,c]) => `
    <tr><td style="width:140px">${n}</td><td class="num" style="width:70px">${v}</td>
    <td><div class="bar"><i style="--w:${(v/total*100).toFixed(1)}%;background:${c}"></i></div></td>
    <td class="num" style="width:70px;color:var(--muted)">${(v/total*100).toFixed(1)}%</td></tr>`).join('') + `</tbody></table>`;

  const f = document.getElementById('findings');
  if (!DATA.findings.length){
    f.innerHTML = `<div class="empty">未发现防御缺口：全部攻击用例均被成功拦截。</div>`;
  } else {
    f.innerHTML = DATA.findings.map(x => `
      <div class="card ${x.level}">
        <h3><span class="tag ${x.level}">${x.level === 'high' ? '高危' : '中危'}</span>
          ${esc(x.family_label)}：${esc(x.title)}
          <span style="color:var(--muted);font-weight:400">（${x.count} / ${x.total}）</span></h3>
        <div class="root"><b>根因：</b>${esc(x.root_cause)}</div>
        <ul>${x.suggestions.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
        ${x.evidence.length ? `<div class="evi">${x.evidence.map(e =>
            `[${esc(e.probe_id)}] ${esc(e.text)}\n  → ${esc(e.response)}`).join('\n\n')}</div>` : ''}
      </div>`).join('');
  }

  const fp = document.getElementById('fps');
  fp.innerHTML = DATA.benign_false_positives.length
    ? `<table><thead><tr><th>编号</th><th>正常请求</th><th>被拦原因</th></tr></thead><tbody>`
      + DATA.benign_false_positives.map(b =>
        `<tr><td>${esc(b.probe_id)}</td><td>${esc(b.text)}</td><td class="root">${esc(b.reason)}</td></tr>`).join('')
      + `</tbody></table>`
    : `<div class="empty">无误报：${m.benign_total} 条正常请求全部放行。</div>`;

  const guarded = DATA.breached_cases.filter(c => c.mode === 'guarded');
  document.getElementById('breached').innerHTML = guarded.length
    ? `<table><thead><tr><th>编号</th><th>攻击族</th><th>攻破方式</th><th>输入</th></tr></thead><tbody>`
      + guarded.map(c => `<tr><td>${esc(c.probe_id)}</td><td>${esc(c.family_label)}</td>
          <td class="v-bad">${esc(c.breach_kind)}</td><td>${esc(c.text)}</td></tr>`).join('')
      + `</tbody></table>`
    : `<div class="empty">无：全部 ${m.probe_total} 条攻击用例均被成功拦截。</div>`;

  document.getElementById('foot').textContent =
    `AICGuard v0.1.0 ｜ AIC 第八届 新疆赛区 · 算法创新赛 · AI+软件创新 ｜ 数据来源：${meta.run_id}`;
}

render();
animateCounts();
renderSweep();
renderCorpus();
renderCompliance();

// 粒子背景（用户指定"动态粒子感"）：缓慢漂移 + 近距连线；reduced-motion / 页面隐藏时停
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('particles'), x = c.getContext('2d');
  let W, H, P;
  const cols = () => document.documentElement.dataset.theme === "light"
    ? { dot: "rgba(12,111,129,.30)", line: a => `rgba(12,111,129,${a})` }
    : { dot: "rgba(96,190,214,.5)", line: a => `rgba(76,195,214,${a})` };
  const reset = () => {
    W = c.width = innerWidth; H = c.height = innerHeight;
    P = Array.from({length: Math.min(90, Math.floor(W * H / 22000))}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
      r: Math.random() * 1.6 + .6 }));
  };
  reset();
  addEventListener('resize', reset);
  const step = () => {
    x.clearRect(0, 0, W, H);
    const col = cols();
    for (const p of P) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7);
      x.fillStyle = col.dot; x.fill();
    }
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      const a = P[i], b = P[j], dx = a.x - b.x, dy = a.y - b.y, d = dx * dx + dy * dy;
      if (d < 16900) {
        x.strokeStyle = col.line((.12 * (1 - d / 16900)).toFixed(3));
        x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke();
      }
    }
    if (!document.hidden) requestAnimationFrame(step);
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) requestAnimationFrame(step); });
  requestAnimationFrame(step);
})();

// 主题切换：记忆手动选择；未选择时跟随系统变化；favicon / theme-color 联动
(function(){
  const FAV = (fill, stroke) => "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3l7 2.6v5.1c0 4.6-2.9 8.2-7 9.8-4.1-1.6-7-5.2-7-9.8V5.6L12 3z' fill='" + fill + "' stroke='" + stroke + "' stroke-width='1.8'/%3E%3Cpath d='M8.9 11.9l2.1 2.2 4.1-4.5' fill='none' stroke='" + stroke + "' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E";
  const THEME_META = {
    dark:  { color: "#0d1420", fav: FAV("%230d1420", "%234cc3d6") },
    light: { color: "#f5f7f9", fav: FAV("%23ffffff", "%230c6f81") },
  };
  const applyMeta = t => {
    document.querySelector('meta[name="theme-color"]').content = THEME_META[t].color;
    document.querySelector('link[rel="icon"]').href = THEME_META[t].fav;
  };
  applyMeta(document.documentElement.dataset.theme);
  document.getElementById("themeToggle").addEventListener("click", () => {
    const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = t;
    localStorage.setItem("aicguard-theme", t);
    applyMeta(t);
  });
  matchMedia("(prefers-color-scheme: light)").addEventListener("change", e => {
    if (!localStorage.getItem("aicguard-theme")) {
      document.documentElement.dataset.theme = e.matches ? "light" : "dark";
      applyMeta(document.documentElement.dataset.theme);
    }
  });
})();
