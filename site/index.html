<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1420">
<title>AICGuard · 中文大模型安全评测与护栏平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3l7 2.6v5.1c0 4.6-2.9 8.2-7 9.8-4.1-1.6-7-5.2-7-9.8V5.6L12 3z' fill='%230d1420' stroke='%234cc3d6' stroke-width='1.8'/%3E%3Cpath d='M8.9 11.9l2.1 2.2 4.1-4.5' fill='none' stroke='%234cc3d6' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    color-scheme:dark;
    --fg:#e6edf5; --muted:#8fa0b3; --accent:#4cc3d6;
    --good:#3fd68c; --line:rgba(148,163,184,.14);
    --bg-grad:linear-gradient(160deg,#101826,#0a0d13 60%,#0b101a);
    --glass-grad:linear-gradient(180deg,rgba(30,42,60,.55),rgba(18,26,38,.65));
    --hero-grad:linear-gradient(120deg,#4cc3d6,#60a5fa);
    --accent-bright:#6fd3e2;
    --serif:"Source Han Serif SC","Noto Serif SC","STZhongsong","SimSun",serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--fg);background:var(--bg-grad) fixed;
       font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       font-size:15px;line-height:1.7;display:flex;align-items:center;justify-content:center;
       padding:40px 20px}
  main{width:100%;max-width:980px}
  .kicker{text-align:center;font-size:12px;letter-spacing:3px;color:var(--muted)}
  h1{font-family:var(--serif);font-size:56px;letter-spacing:2px;text-align:center;margin:14px 0 6px;
     background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{text-align:center;color:var(--muted);font-size:16px;margin:0 0 6px}
  .rule{height:1px;background:var(--line);margin:26px 0 24px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .card{display:flex;flex-direction:column;gap:8px;padding:22px 24px;border:1px solid var(--line);
        border-radius:14px;background:var(--glass-grad);backdrop-filter:blur(10px);
        color:inherit;text-decoration:none;transition:border-color .15s ease,transform .15s ease}
  a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
  a.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .card h2{font-family:var(--serif);font-size:19px;margin:0}
  .card p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
  .go{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
  .card.disabled{opacity:.72}
  .card.disabled .go{color:var(--muted)}
  footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);
         color:var(--muted);font-size:12px;text-align:center}
  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<main>
  <div class="kicker">AIC 第八届全球校园人工智能算法精英大赛 · 新疆赛区 · AI+软件创新</div>
  <h1>AICGuard</h1>
  <p class="sub">中文大模型安全评测与护栏平台</p>
  <div class="rule"></div>

  <div class="cards">
    <a class="card" href="/report">
      <h2>体检报告</h2>
      <p>374 条攻击用例的防御效果、分攻击族表现、阈值权衡曲线与合规整改建议。</p>
      <span class="go">查看报告 →</span>
    </a>
    <a class="card" href="/intro">
      <h2>开场动画</h2>
      <p>3D 片头演示，需要浏览器支持 WebGL。</p>
      <span class="go">播放 →</span>
    </a>
    <div class="card disabled">
      <h2>控制台</h2>
      <p>体检台 / 攻击试探 / 评测中心 / 进化实验室，依赖本地后端接口，静态站点无法单独运行。</p>
      <span class="go">本地运行 start.bat 后访问 127.0.0.1:7777</span>
    </div>
  </div>

  <footer>AICGuard v0.1.0 ｜ 静态演示站 · 报告与片头可直接浏览，控制台需本地启动</footer>
</main>
</body>
</html>
